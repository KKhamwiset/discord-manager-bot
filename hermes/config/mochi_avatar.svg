<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#FFE4E1" />
  <!-- Mochi Body -->
  <ellipse cx="100" cy="110" rx="60" ry="50" fill="#FFFFFF" />
  <!-- Blush -->
  <ellipse cx="70" cy="115" rx="10" ry="6" fill="#FFB6C1" opacity="0.8" />
  <ellipse cx="130" cy="115" rx="10" ry="6" fill="#FFB6C1" opacity="0.8" />
  <!-- Eyes -->
  <circle cx="80" cy="100" r="6" fill="#333333" />
  <circle cx="120" cy="100" r="6" fill="#333333" />
  <!-- Eye sparkles -->
  <circle cx="82" cy="98" r="2" fill="#FFFFFF" />
  <circle cx="122" cy="98" r="2" fill="#FFFFFF" />
  <!-- Mouth -->
  <path d="M 90 120 Q 100 128 110 120" stroke="#333333" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- Cat/Mochi Ears -->
  <path d="M 50 80 L 65 50 L 80 75 Z" fill="#FFFFFF" />
  <path d="M 120 75 L 135 50 L 150 80 Z" fill="#FFFFFF" />
  <!-- Inner Ears -->
  <path d="M 55 75 L 65 58 L 75 73 Z" fill="#FFB6C1" />
  <path d="M 125 73 L 135 58 L 145 75 Z" fill="#FFB6C1" />
  <!-- Text -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FF69B4" text-anchor="middle">Mochi-chan</text>
</svg>